<style>
  :root { --ground:#FFFFFF; --tint:#F3EEE8; --paper:#F7F4F0; --ink:#101820; --ring:#31261D; --bronze:#8B634B; --muted:#5B5550;
          --serif:'Noto Serif TC','Source Han Serif TC','Noto Serif CJK TC',serif; --optima:Optima,'Optima nova','Tenor Sans',sans-serif; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--optima), var(--serif); background: var(--paper); color: var(--ink);
         min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px calc(32px + env(safe-area-inset-bottom)); }
  .en { font-family: var(--optima); }
  main { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: .08em; }
  header h1::after { content: ""; display: block; width: 32px; height: 2px; background: var(--bronze); margin-top: 10px; }
  header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  figure { display: flex; flex-direction: column; gap: 8px; }
  figcaption { font-size: 12px; color: var(--muted); letter-spacing: .12em; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 12px 30px rgba(49,38,29,.14); }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px 12px;
         border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 600; text-align: center; }
  .btn.primary { background: var(--ring); color: #fff; }
  .btn.ghost { background: var(--tint); color: var(--ink); }
  .btn.ghost svg { color: var(--bronze); }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  .btn { white-space: nowrap; font-size: 14px; gap: 6px; }
  .btn .en { font-size: 13px; }
  header h1 .en { font-size: 18px; letter-spacing: .02em; }
  header p .en { white-space: nowrap; }
  @media (max-width: 380px) { .actions { grid-template-columns: minmax(0, 1fr); } }
  footer { font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
