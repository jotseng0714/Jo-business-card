<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>曾詩喬 名片｜弘林環境生技</title>

<meta name="theme-color" content="#D5DCCC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Poppins:wght@400;500&display=swap">
<style>
  :root { --ground:#D5DCCC; --tint:#E9EDE3; --paper:#F8F9F5; --ink:#2E3B2A; --muted:#535E4D; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', 'Poppins', system-ui, sans-serif; background: var(--paper); color: var(--ink);
         min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px calc(32px + env(safe-area-inset-bottom)); }
  .en { font-family: 'Poppins', 'Noto Sans TC', sans-serif; }
  main { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 24px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: .08em; }
  header p { font-size: 13px; color: var(--muted); margin-top: 4px; }
  figure { display: flex; flex-direction: column; gap: 8px; }
  figcaption { font-size: 12px; color: var(--muted); letter-spacing: .12em; }
  figure img { width: 100%; height: auto; display: block; border-radius: 4px; box-shadow: 0 12px 30px rgba(46,59,42,.14); }
  .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 8px 12px;
         border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 700; text-align: center; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.ghost { background: var(--tint); color: var(--ink); }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
  @media (max-width: 380px) { .actions { grid-template-columns: minmax(0, 1fr); } }
  footer { font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>曾詩喬 <span class="en" style="font-weight:500">Shih-Chiao (Jo) Tseng</span></h1>
    <p>弘林環境生技股份有限公司 創辦人暨執行長 <span class="en">· Founder &amp; CEO</span></p>
  </header>

  <figure>
    <figcaption>正面 <span class="en">FRONT</span></figcaption>
    <img src="card-front.png" width="2126" height="1275" alt="名片正面：弘林環境生技股份有限公司 水滴波紋 logo，Honglin Environmental Biotech Co., Ltd.">
  </figure>

  <figure>

    <img src="card-back.png" width="2126" height="1275" alt="名片背面：曾詩喬 Shih-Chiao (Jo) Tseng，創辦人暨執行長 Founder & CEO，手機 +886 921 731 527，電話 +886 3 621 0237，jotseng@gmail.com，旗下寵物品牌 HLEBÉ 赫樂貝">
  </figure>

  <div class="actions">
    <a class="btn primary" href="https://jotseng0714.github.io/hlebe-card/jo-tseng.vcf" download="Shih-Chiao_Jo_Tseng.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
      儲存聯絡人 <span class="en" style="font-weight:500">Save</span></a>
    <a class="btn ghost" href="https://jotseng0714.github.io/hlebe-card/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
      電子名片 <span class="en" style="font-weight:500">Digital Card</span></a>
  </div>

  <footer class="en">© Honglin Environmental Biotech Co., Ltd.</footer>
</main>
</body>
</html>
