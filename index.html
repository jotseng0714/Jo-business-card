<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLEBÉ 曾詩喬 名片設計 - 輕盈苔綠版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .card {
            width: 510px;
            height: 306px;
            border-radius: 2px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.06);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 40px;
            background-color: #C2CCB2; /* 莫蘭迪苔綠底色 */
        }

        /* 右上角斜長直角三角形 */
        .corner-tr {
            position: absolute;
            top: 0;
            right: 0;
            width: 120px;
            height: 60px;
            background-color: #DCE6C2; 
            clip-path: polygon(0 0, 100% 0, 100% 100%);
        }

        /* 左下角斜長直角三角形 */
        .corner-bl {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 120px;
            height: 60px;
            background-color: #DCE6C2; 
            clip-path: polygon(0 0, 0 100%, 100% 100%);
        }

        .text-dark-green {
            color: #2F3E1B; /* 深橄欖綠文字 */
        }

        .text-light-info {
            color: #4A5638; /* 中性綠資訊 */
        }

        .title-spacing {
            letter-spacing: 0.25em;
            font-size: 7.5pt;
        }

        .name-spacing {
            letter-spacing: 0.15em;
        }

        /* QR Code 容器：增加可點擊的手勢與縮放效果 */
        .qr-container {
            width: 60px;
            height: 60px;
            background-color: white;
            padding: 4px;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .qr-container:hover {
            transform: scale(1.1);
        }

        .deco-line {
            height: 0.5px;
            background: rgba(47, 62, 27, 0.15);
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="flex flex-col items-center">
        <!-- 標題說明 -->
        <div class="mb-12 text-center">
            <h1 class="text-2xl font-light text-gray-800 tracking-widest">HLEBÉ 品牌視覺更新</h1>
            <p class="text-gray-400 mt-2 text-xs uppercase tracking-widest italic">互動式數位預覽：點擊 QR Code 可直接儲存聯絡人</p>
        </div>

        <!-- 正面 (Front) -->
        <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-gray-300 mb-3 tracking-[0.3em] uppercase">Front View</span>
            <div class="card p-12 flex flex-col justify-center items-center">
                <div class="corner-tr"></div>
                <div class="corner-bl"></div>

                <div class="text-center z-10">
                    <h2 class="text-dark-green text-3xl font-medium name-spacing mb-4">
                        曾 詩 喬 <span class="text-xl font-light opacity-70 ml-2">Jo Tseng</span>
                    </h2>
                    <p class="text-light-info title-spacing uppercase font-medium">總 經 理 &nbsp; General Manager</p>
                </div>
                
                <div class="absolute bottom-12 left-20 right-20 deco-line"></div>
            </div>
        </div>

        <!-- 背面 (Back) -->
        <div class="flex flex-col items-center">
            <span class="text-[10px] font-bold text-gray-300 mb-3 tracking-[0.3em] uppercase">Back View</span>
            <div class="card p-10 flex flex-col justify-between text-dark-green">
                <div class="corner-tr"></div>
                <div class="corner-bl"></div>

                <!-- Logo 區域 -->
                <div class="flex flex-col items-center z-10">
                    <svg width="46" height="46" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="mb-3">
                        <path d="M50 15C50 15 25 40 25 65C25 78.8071 36.1929 90 50 90C63.8071 90 75 78.8071 75 65C75 40 50 15 50 15Z" stroke="#2F3E1B" stroke-width="2.5"/>
                        <circle cx="50" cy="62" r="10" fill="#2F3E1B" fill-opacity="0.15" />
                        <circle cx="38" cy="50" r="5" fill="#2F3E1B" />
                        <circle cx="62" cy="50" r="5" fill="#2F3E1B" />
                        <circle cx="50" cy="42" r="5" fill="#2F3E1B" />
                    </svg>
                    <div class="text-center">
                        <h3 class="text-lg tracking-[0.5em] font-normal text-dark-green">HLEBÉ</h3>
                        <p class="text-[9px] tracking-[0.15em] text-light-info mt-1 font-medium uppercase">Honglin Environmental Biotechnology</p>
                    </div>
                </div>

                <div class="text-center z-10">
                    <p class="text-sm font-medium tracking-[0.3em]">弘林環境生技</p>
                </div>

                <!-- 聯絡資訊與 QR Code -->
                <div class="flex justify-between items-end border-t border-[#2F3E1B]/10 pt-6 z-10">
                    <!-- 點擊此處將自動下載聯絡人檔案 -->
                    <div class="qr-container" onclick="downloadVCard()" title="點擊直接新增聯絡人">
                        <img id="qrImg" src="" alt="QR Code" class="w-full h-full" />
                    </div>
                    <div class="text-[10px] text-right space-y-1 font-medium text-light-info">
                        <p>0921-731-527</p>
                        <p>jotseng@gmail.com</p>
                        <p>苗栗市新川里龍岡 8-1 號</p>
                        <p class="pt-1 opacity-50 text-[8px]">統編 62198034</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 提示文字 -->
        <p class="mt-4 text-xs text-gray-400">當透過 AirDrop 分享此網頁給客戶時，點擊 QR Code 即可自動新增您的聯絡資訊</p>
    </div>

    <script>
        // 自動生成 QR Code (連結到當前網址)
        window.onload = function() {
            const currentUrl = window.location.href;
            const qrImg = document.getElementById('qrImg');
            // 使用深橄欖綠色製作 QR Code 點陣，以符合整體視覺
            qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}&color=2F3E1B&bgcolor=FFFFFF`;
        };

        // 生成並下載 vCard 檔案的功能
        function downloadVCard() {
            const vCardData = [
                "BEGIN:VCARD",
                "VERSION:3.0",
                "FN:曾詩喬 Jo Tseng",
                "ORG:弘林環境生技;Honglin Environmental Biotechnology",
                "TITLE:總經理 General Manager",
                "TEL;TYPE=CELL:0921731527",
                "EMAIL:jotseng@gmail.com",
                "ADR;TYPE=WORK:;;苗栗縣苗栗市新川里 003 鄰龍岡 8-1 號;苗栗縣;苗栗市;;台灣",
                "NOTE:統一編號: 62198034",
                "END:VCARD"
            ].join("\n");

            const blob = new Blob([vCardData], { type: "text/vcard" });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.setAttribute("download", "曾詩喬_Jo_Tseng.vcf");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
